name: Refresh career opportunities

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "src/**"
      - ".github/workflows/update-jobs.yml"
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:
    inputs:
      use_ai:
        description: "Use the OpenAI Career Fit Agent"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: career-opportunity-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanner
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Refresh and score open roles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.use_ai }}" == "false" ]]; then
            python -m rochelle_agent.scan --no-ai
          else
            python -m rochelle_agent.scan
          fi

      - name: Commit database update
        run: |
          git config user.name "Rochelle 2.0 Career Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json docs/data/status.json
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Refresh career opportunities"
            git push
          fi
