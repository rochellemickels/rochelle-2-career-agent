name: Refresh career opportunities

on:
  push:
    branches: [main]
    paths:
      - "config/**"
      - "src/**"
      - ".github/workflows/update-jobs.yml"
  schedule:
    # Monday, Wednesday, and Friday at 7:30 AM Central during daylight time.
    - cron: "30 12 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: career-opportunity-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install scanner
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Refresh and score open roles
        run: python -m rochelle_agent.scan

      - name: Commit database update
        run: |
          git config user.name "Rochelle 2.0 Career Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json docs/data/status.json
          if git diff --cached --quiet; then
            echo "No database changes to commit."
          else
            git commit -m "Refresh career opportunities"
            git push
          fi
