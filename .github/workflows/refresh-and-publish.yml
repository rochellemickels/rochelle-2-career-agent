name: Refresh, Score & Publish Career Portal

on:
  workflow_dispatch:
  schedule:
    # Monday, Wednesday, and Friday at 7:30 AM Central during daylight time.
    - cron: "30 12 * * 1,3,5"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "src/**"
      - "tests/**"
      - "docs/**"
      - "pyproject.toml"
      - ".github/workflows/refresh-and-publish.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: career-refresh-score-publish
  cancel-in-progress: false

jobs:
  refresh-score-publish:
    name: Scan → score → commit → publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the live main branch
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up the browser Word generator
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pin and vendor the real DOCX library
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund docx@9.5.1
          mkdir -p docs/assets/vendor
          cp node_modules/docx/dist/index.mjs docs/assets/vendor/docx.mjs

      - name: Install the scanner
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Verify backend and combined frontend filters
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v
          node --test tests/test_frontend.mjs
          python -m compileall -q src tests
          node --check docs/assets/app.mjs
          node --check docs/assets/studio.mjs
          test -s docs/assets/vendor/docx.mjs

      - name: Scan and compute the one authoritative score
        run: python -m rochelle_agent.scan

      - name: Validate published data contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          jobs = json.loads(Path("docs/data/jobs.json").read_text(encoding="utf-8"))
          assert jobs["metadata"]["scoring_authority"] == "src/rochelle_agent/scoring.py::score_job"
          assert all(job["score"] == max(0, min(100, sum(job["breakdown"].values()))) for job in jobs["jobs"])
          assert all(job["location_eligibility"] != "Non-US only" for job in jobs["jobs"])
          print(f"Validated {len(jobs['jobs'])} published jobs and one-score integrity.")
          PY

      - name: Commit the exact data being published
        run: |
          git config user.name "Rochelle 2.0 Career Portal"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/jobs.json docs/data/status.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Refresh scored career opportunities"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the refreshed portal
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Publish the refreshed portal
        id: deployment
        uses: actions/deploy-pages@v4
