[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rochelle-2-career-agent"
version = "0.1.0"
description = "Automated career discovery and job-matching portal for Rochelle 2.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10",
]

[project.scripts]
rochelle-career-scan = "rochelle_agent.scan:main"

[tool.setuptools.packages.find]
where = ["src"]
